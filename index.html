<style>
:root{
  --navy:#141c3a;
  --navy-2:#1d2550;
  --navy-3:#2a3468;
  --gold:#d9b25f;
  --gold-soft:#f0dcaa;
  --paper:#f6f4ee;
  --paper-2:#fffdf8;
  --ink:#232838;
  --ink-2:#5c6379;
  --line:#ded8c8;
  --ok:#4d7a52;
  --radius:3px;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--body);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
a{color:var(--navy-3)}

/* ---------- layout ---------- */
.shell{display:flex;min-height:100vh}
.side{
  width:290px;flex:0 0 290px;background:var(--navy);color:#e9e6dd;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  border-right:1px solid #0b1128;
}
.main{flex:1;min-width:0;padding:0 0 90px}
.wrap{max-width:820px;margin:0 auto;padding:0 28px}

/* ---------- sidebar ---------- */
.brand{padding:26px 22px 20px;border-bottom:1px solid rgba(217,178,95,.22);text-align:center}
.brand img{width:78px;height:78px;border-radius:2px;display:block;margin:0 auto 12px}
.brand .inst{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin:0}
.brand .prog{font-family:var(--body);font-size:12px;color:#a9adc4;margin:14px 0 6px}
.bar{height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);width:0;transition:width .35s ease}
nav.discs{padding:14px 0 30px}
.navlabel{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8a90ab;padding:12px 22px 8px}
.navitem{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:none;border:0;color:#dcd9d0;padding:11px 22px;cursor:pointer;
  font-family:var(--body);font-size:13.5px;line-height:1.35;border-left:3px solid transparent;
}
.navitem:hover{background:rgba(255,255,255,.05)}
.navitem.on{background:var(--navy-2);border-left-color:var(--gold);color:#fff}
.navitem .num{font-family:var(--mono);font-size:11px;color:var(--gold);padding-top:2px;min-width:20px}
.navitem .t{flex:1}
.navitem .t small{display:block;color:#9096b0;font-size:11px;margin-top:2px}
.navitem .pct{font-family:var(--mono);font-size:10.5px;color:#9096b0;padding-top:3px}
.navitem.done .pct{color:var(--gold)}

/* ---------- topbar (mobile) ---------- */
.topbar{display:none;position:sticky;top:0;z-index:40;background:var(--navy);color:#fff;
  padding:10px 16px;align-items:center;gap:12px}
.topbar img{width:32px;height:32px;border-radius:2px}
.topbar select{
  flex:1;background:var(--navy-2);color:#fff;border:1px solid rgba(217,178,95,.35);
  border-radius:var(--radius);padding:8px 10px;font-family:var(--body);font-size:13px}

/* ---------- header of a view ---------- */
.head{background:var(--navy);color:#f2efe6;padding:44px 0 38px;margin-bottom:0}
.head .wrap{display:flex;gap:26px;align-items:flex-start}
.head .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 10px}
.head h1{font-family:var(--display);font-weight:600;font-size:31px;line-height:1.15;margin:0 0 8px;letter-spacing:-.01em}
.head .prof{margin:0;font-size:14px;color:#b9bccf}
.head .prof b{color:#fff;font-weight:600}

/* signature: matriz 3x3 dos 9 domínios */
.matrix{flex:0 0 108px;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:4px}
.matrix span{
  aspect-ratio:1;border:1px solid rgba(217,178,95,.3);border-radius:1px;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:8px;letter-spacing:.04em;color:rgba(240,220,170,.5);
  text-align:center;padding:1px;line-height:1.05;
}
.matrix span.lit{background:var(--gold);border-color:var(--gold);color:#141c3a;font-weight:700}
.matrix span.all{background:rgba(217,178,95,.28);color:#f0dcaa}
.matcap{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  color:#8a90ab;text-align:center;margin:8px 0 0}

/* ---------- ementa strip ---------- */
.units{background:var(--navy-2);color:#cfd2e2;padding:14px 0 16px;border-bottom:3px solid var(--gold)}
.units .wrap{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px}
.units span{display:flex;gap:7px;align-items:baseline}
.units b{font-family:var(--mono);font-size:10px;color:var(--gold);font-weight:400}

/* ---------- blocks ---------- */
.block{
  background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);
  margin:22px 0;overflow:hidden;
}
.block>header{
  display:flex;gap:14px;align-items:flex-start;padding:18px 20px 14px;cursor:pointer;
  border-bottom:1px solid transparent;
}
.block.open>header{border-bottom-color:var(--line)}
.block>header:hover{background:#faf7ee}
.bn{font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--navy);
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 26px;margin-top:2px}
.bt{flex:1}
.bt h2{font-family:var(--display);font-size:19px;font-weight:600;margin:0;line-height:1.25}
.bt p{margin:5px 0 0;font-size:13px;color:var(--ink-2)}
.bstate{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);white-space:nowrap;padding-top:6px}
.bstate.full{color:var(--ok)}
.chev{color:var(--ink-2);font-size:12px;padding-top:6px;transition:transform .2s}
.block.open .chev{transform:rotate(90deg)}
.body{display:none;padding:4px 20px 22px}
.block.open .body{display:block}

h3.sec{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-2);margin:20px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h3.sec:first-child{margin-top:8px}

.orient{font-size:14.5px;color:var(--ink);background:#f4f1e6;border-left:3px solid var(--navy-3);
  padding:12px 16px;border-radius:0 var(--radius) var(--radius) 0;margin:0}

ul.sug{list-style:none;margin:0;padding:0}
ul.sug li{position:relative;padding:0 0 0 20px;margin:0 0 9px;font-size:14.5px}
ul.sug li::before{content:"—";position:absolute;left:0;color:var(--gold);font-weight:700}
ul.sug li b{font-weight:600}

label.chk{display:flex;gap:11px;align-items:flex-start;padding:8px 10px;border-radius:var(--radius);
  cursor:pointer;font-size:14.5px;transition:background .15s}
label.chk:hover{background:#f5f2e7}
label.chk input{margin:4px 0 0;width:16px;height:16px;flex:0 0 16px;accent-color:var(--navy-3);cursor:pointer}
label.chk.done>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--gold)}

.notewrap{margin-top:18px}
.notehead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.notehead label{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2)}
.saved{font-family:var(--mono);font-size:10px;color:var(--ok);opacity:0;transition:opacity .3s}
.saved.show{opacity:1}
textarea{
  width:100%;min-height:96px;resize:vertical;padding:12px 14px;font-family:var(--body);font-size:14.5px;
  line-height:1.55;color:var(--ink);background:#fffdf6;border:1px solid var(--line);border-radius:var(--radius);
}
textarea:focus{outline:2px solid var(--navy-3);outline-offset:-1px;background:#fff}

/* ---------- callout ---------- */
.help{background:var(--navy);color:#e9e6dd;border-radius:var(--radius);padding:22px 24px;margin:30px 0 10px}
.help h4{font-family:var(--display);font-size:19px;margin:0 0 8px;color:#fff;font-weight:600}
.help p{margin:0 0 10px;font-size:14.5px;color:#c8cadb}
.help p:last-child{margin-bottom:0}
.help a{color:var(--gold-soft)}
.help .sig{font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--gold);margin-top:14px}

/* ---------- home ---------- */
.lede{font-family:var(--display);font-size:19px;line-height:1.5;color:var(--ink);margin:26px 0 4px}
.six{border-top:1px solid var(--line);margin-top:24px}
.six>div{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.six .n{font-family:var(--mono);font-size:11px;color:var(--gold);background:var(--navy);
  width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 24px}
.six h4{margin:0 0 3px;font-family:var(--display);font-size:17px;font-weight:600}
.six p{margin:0;font-size:14px;color:var(--ink-2)}
.tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:26px 0 0}
.tally a{
  display:block;text-decoration:none;color:var(--ink);background:var(--paper-2);
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.tally a:hover{border-color:var(--navy-3)}
.tally .k{font-family:var(--mono);font-size:10px;color:var(--gold);letter-spacing:.14em}
.tally .v{font-size:13.5px;margin-top:4px;line-height:1.3}
.tally .p{font-family:var(--mono);font-size:11px;color:var(--ink-2);margin-top:6px}

/* ---------- toolbar ---------- */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:34px 0 0;padding-top:20px;border-top:1px solid var(--line)}
button.btn{
  font-family:var(--body);font-size:13px;padding:9px 16px;border-radius:var(--radius);cursor:pointer;
  background:var(--navy);color:#fff;border:1px solid var(--navy);
}
button.btn:hover{background:var(--navy-3);border-color:var(--navy-3)}
button.btn.ghost{background:transparent;color:var(--navy);border-color:var(--line)}
button.btn.ghost:hover{background:#efece1;color:var(--navy)}
footer.foot{max-width:820px;margin:40px auto 0;padding:20px 28px 0;border-top:1px solid var(--line);
  font-size:12px;color:var(--ink-2)}

@media (max-width:860px){
  .side{display:none}
  .topbar{display:flex}
  .head{padding:28px 0 24px}
  .head .wrap{flex-direction:column-reverse;gap:16px}
  .head h1{font-size:25px}
  .matrix{flex:none;width:96px}
  .wrap{padding:0 18px}
  .units .wrap{gap:6px 14px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  .side,.topbar,.tools,.chev{display:none}
  .body{display:block!important}
  .block{break-inside:avoid}
}
</style>

      "A U3 lista processos que reaparecem nas disciplinas 7 a 12 — trate-os como reconhecimento de padrão, deixando o aprofundamento para elas."],
   c:["Revisei as cinco unidades e aprovei ou ajustei os tópicos","Conferi o limite com a Disciplina 4 (conceitos) e a 6 (formulação em rede)","Ajustei a U3 para reconhecer processos sem antecipar as disciplinas de domínio","Revisei a bibliografia básica"]},
  {s:["Objeto de aprendizagem natural para esta disciplina: <b>“Clínica em Foco: análise de caso”</b> — trecho de fala do paciente e o aluno aponta antecedente, resposta e consequência.",

  {s:["Mostre que <b>uma boa pergunta acessa mais de um domínio</b>: “o que passou pela sua cabeça naquela hora?” toca cognição, atenção e afeto ao mesmo tempo — o que muda é o que você faz com a resposta.",

  {s:["Dois planos de função aqui: a função dos <b>processos avaliados</b> (o que o padrão resolve para o paciente no curto prazo) e a função da <b>própria avaliação</b> (medir o que muda, não o que rotula).",
      "Vale mostrar que a mesma resposta a um instrumento tem significados opostos conforme a função — a mesma pontuação alta de evitação em dois casos distintos."],
   c:["Expliquei a função de curto prazo dos processos avaliados","Mostrei a leitura evolutiva de ao menos um processo","Diferenciei avaliação que classifica de avaliação que rastreia mecanismo"]},
  {s:["Esta unidade é o coração da sua disciplina. Sugestões de instrumento: roteiro de <b>análise funcional</b> em autorrelato, monitoramento idiográfico diário (EMA) e medidas de rotina (ORS/SRS) na lógica do MBC.",
      "Roleplay recomendado: entrevista de avaliação em que você <b>pausa a cada pergunta</b> para dizer qual processo ela acessa, e vai preenchendo o diagrama dos nove domínios ao vivo.",
      "Fico à disposição para fazer o papel de paciente nesse roleplay."],
   c:["Escolhi o instrumento qualitativo/de autorrelato que será demonstrado","Selecionei o caso e defini o nó principal","Montei o diagrama dos nove domínios pré-desenhado, com setas em transição","Gravei ou agendei o roleplay de entrevista avaliativa"]},
  {s:["A “intervenção” desta disciplina é a <b>devolutiva</b>: apresentar ao paciente a leitura dos processos e negociar o alvo — cena curta e muito ensinável.",
      "Alternativa: demonstrar a implantação do monitoramento (escolher dois indicadores idiográficos com o paciente e combinar como registrar)."],
   c:["Escolhi a cena (devolutiva ou implantação de monitoramento)","Deixei explícito como a avaliação vira alvo terapêutico","Gravei ou agendei o roleplay"]}
 ]},

{n:6, dom:null, tit:"Metamodelo Evolucionário, Análise em Rede e Formulação Processual", prof:"Júlio Gonçalves",
 un:["O metamodelo evolucionário na psicoterapia","Variação, seleção e retenção","Mudança psicológica na perspectiva evolucionária","Análise em rede de processos","Formulação processual e planejamento"],
 b:[
  {s:["É a disciplina-eixo: confira se a U1 não repete a introdução ao metamodelo feita na U5 da Disciplina 4, e se a U5 não invade o terreno da avaliação (Disciplina 5).",
      "Fixe aqui a notação de rede — nó, aresta, alça, nó central, alavanca — que as disciplinas 7 a 12 vão usar nos diagramas."],
   c:["Revisei as cinco unidades e aprovei ou ajustei os tópicos","Conferi o limite com as Disciplinas 4 e 5","Fixei a notação de rede que servirá de padrão para as demais disciplinas","Revisei a bibliografia básica"]},
  {s:["Objeto de aprendizagem forte aqui: caso com processos já mapeados e o aluno <b>escolhe a alavanca</b> e justifica (situação-problema com cinco alternativas).",
      "Outra opção: flash cards com um diagrama de rede na imagem e a pergunta sobre qual seta explica a manutenção."],
   c:FLUXO},
  {s:["Sua disciplina <b>é</b> a articulação entre domínios — o cuidado inverso: não deixar a rede virar abstração. Ancore cada exemplo em processos nomeados de domínios diferentes.",
      "Mostre a mesma rede com duas alavancas possíveis e o que cada escolha prevê para os outros nós."],
   c:["Toda rede apresentada usa processos de pelo menos três domínios","Mostrei o efeito previsto de mexer em um nó sobre os demais","Indiquei de onde vêm os dados que alimentam cada nó"]},
  {s:["Variação, seleção e retenção <b>são</b> a resposta funcional: mostre um padrão clínico como repertório que foi selecionado por funcionar e retido por repetição.",
      "Deixe explícito o critério de contexto — o mesmo repertório é adaptativo num ambiente e mantenedor em outro."],
   c:["Apresentei ao menos um padrão clínico lido em chave de VSR","Expliquei a mudança de contexto que transforma função adaptativa em mantenedora","Conectei VSR à escolha de alvo terapêutico"]},
  {s:["Aqui o instrumento é a própria <b>formulação</b>: demonstre a passagem dos dados brutos ao diagrama, decidindo em voz alta o que entra como nó e o que fica de fora.",
      "Roleplay recomendado: montar a rede ao vivo a partir de uma entrevista, com o diagrama dos nove domínios pré-montado e as setas surgindo por transição."],
   c:["Selecionei o caso e defini o nó central","Montei o diagrama dos nove domínios pré-desenhado com setas em transição","Explicitei o critério de inclusão e exclusão de nós","Gravei ou agendei o roleplay de formulação"]},
  {s:["A intervenção desta disciplina é a <b>escolha e o teste da alavanca</b>: escolher um nó, propor a perturbação e definir como saber, em duas semanas, se a rede se moveu.",
      "Vale mostrar a revisão da formulação diante de um resultado que não confirmou a hipótese."],
   c:["Defini a alavanca e a intervenção que será demonstrada","Estabeleci como a mudança na rede será monitorada","Gravei ou agendei o roleplay"]}
 ]},

{n:7, dom:0, tit:"Processos Atencionais e Intervenções para Flexibilização da Atenção", prof:"Ana Galimberti",
 un:["Atenção como processo e mecanismo de mudança","Rigidez atencional, foco estreito e hipervigilância","Shifting e interações atenção–cognição–emoção","Atenção, memória e loops cognitivo-emocionais","Intervenções para flexibilização da atenção"],
 b:[
  {s:["Confira se a U3 e a U4 não invadem a Disciplina 8 (ruminação e preocupação como processos cognitivos): aqui o recorte é a <b>atenção que alimenta</b> esses padrões, não o padrão em si.",
      "A U5 é a unidade de intervenção; a avaliação da rigidez atencional pode entrar ao final da U2 ou abrir a U5."],
   c:["Revisei as cinco unidades e aprovei ou ajustei os tópicos","Conferi o limite com as Disciplinas 8 (cognição) e 9 (afeto)","Defini onde entra a avaliação da rigidez atencional","Revisei a bibliografia básica"]},
  {s:["Objeto de aprendizagem sugerido: <b>flash cards</b> com trechos de fala e a pergunta “onde está a atenção deste paciente — no corpo, na ameaça externa, no erro passado?”.",
      "Para a U4, uma “Clínica em Foco” com o loop atenção → memória → emoção rende um objeto forte."],
   c:FLUXO},
  {s:["Ancore a articulação obrigatória: todo processo atencional carrega componente emocional — o estímulo que, por pareamento, elicia emoção e, repetido, consolida sentimento e <b>memória</b>.",
      "Com a cognição: atenção presa ao erro passado alimenta ruminação, que devolve o foco ao mesmo conteúdo (a alça da U4).",
      "Com o comportamento: hipervigilância sustenta checagem e esquiva; sem isso, a atenção vira tema cognitivo puro."],
   c:["Trabalhei explicitamente atenção × emoção","Trabalhei explicitamente atenção × memória e cognição","Trabalhei explicitamente atenção × comportamento (checagem, esquiva)","Montei ao menos um loop com três domínios"]},
  {s:["Plano evolutivo: o estreitamento atencional sobre indícios de ameaça protege a vida e a prole — por isso o paciente ansioso foca exatamente no sinal de perigo. Essa é a resposta ao “para que serve”.",
      "Plano de manutenção: o mesmo estreitamento, rígido e fora de contexto, impede a coleta de informação desconfirmatória e mantém o quadro.",
      "Um par de exemplos contrastantes (mesma hipervigilância útil no plantão, mantenedora no jantar em família) fecha o ponto."],
   c:["Apresentei a função adaptativa/evolutiva do estreitamento atencional","Mostrei como o mesmo processo, rígido, mantém o sofrimento","Usei ao menos um par de exemplos contrastantes por contexto"]},
  {s:["Instrumentos possíveis para rigidez atencional (confira a versão em português antes de indicar): <b>Attentional Control Scale</b> (Derryberry &amp; Reed), <b>CAS-1</b> de Wells para a síndrome cognitivo-atencional, <b>MAAS</b> ou <b>FFMQ</b> para atenção plena; ou um roteiro qualitativo próprio, com perguntas sobre para onde a atenção vai, quanto tempo fica e quanto custa sair.",
      "Roleplay recomendado: aplicar o instrumento em voz alta, <b>explicando a cada pergunta qual processo ela acessa</b>, e responder como o paciente responderia.",
      "Escolha um caso cujo nó central seja atencional (hipervigilância, monitoramento interno) e trace as setas para cognição, afeto e comportamento sobre o diagrama pré-montado.",
      "Fico à disposição para fazer o papel de paciente, se preferir o roleplay em dupla."],
   c:["Escolhi o instrumento qualitativo de autorrelato","Selecionei o caso com nó central atencional","Montei o diagrama dos nove domínios pré-desenhado com setas em transição","Gravei ou agendei o roleplay de avaliação"]},
  {s:["Procedimentos que casam com o domínio: <b>Attention Training Technique</b> (Wells), ancoragem e grounding, prática de foco aberto × focado × alternante, treino de desengajamento.",
      "Sugestão forte aqui: conduzir a prática <b>em tempo real</b>, para o aluno executar junto com o vídeo — o domínio atencional é o que melhor aceita esse formato.",
      "Feche articulando: o que muda na ruminação e na esquiva quando a atenção fica mais flexível, e como você mede isso."],
   c:["Escolhi o procedimento que será conduzido em cena","Defini o formato (prática ao vivo, aplicador-paciente ou paciente convidado)","Articulei o efeito da intervenção sobre os domínios vizinhos","Indiquei como monitorar a mudança clínica"]}
 ]},

{n:8, dom:1, tit:"Processos Cognitivos e Intervenções Baseadas em Função Cognitiva", prof:"Natércia Sampaio",
 un:["Cognição como processo e mecanismo de mudança","Ruminação e preocupação","Fusão, regras verbais e inferências automáticas","Interação cognição–atenção–emoção","Intervenções cognitivas orientadas por processo"],
 b:[
  {s:["O risco de sobreposição aqui é com a Disciplina 7 (atenção) e a 10 (self): a autocrítica como <b>conteúdo</b> é do self; o que é seu é a <b>fusão</b> com esse conteúdo e a regra verbal que a sustenta.",
      "Confira se a U5 não repete a reestruturação clássica já vista em formação anterior dos alunos — o recorte prometido é função, não veracidade."],
   c:["Revisei as cinco unidades e aprovei ou ajustei os tópicos","Conferi o limite com as Disciplinas 7 (atenção) e 10 (self)","Confirmei que a U5 trata função, e não apenas conteúdo do pensamento","Revisei a bibliografia básica"]},
  {s:["Objeto de aprendizagem sugerido: <b>situação-problema</b> com um mesmo pensamento em dois pacientes e cinco alternativas de leitura funcional.",
      "Flash cards funcionam bem para o par ruminação × preocupação (passado × futuro) e para regras verbais “se… então…”."],
   c:FLUXO},
  {s:["Com a atenção: a ruminação depende do foco preso no conteúdo — sem desengajamento atencional não há repetição cognitiva.",
      "Com o afeto: mostre a cognição como <b>moduladora</b> da intensidade emocional, e a emoção como gatilho do próximo ciclo de pensamento.",
      "Com o comportamento: a regra verbal rígida produz esquiva; é o que transforma pensamento em padrão clínico observável."],
   c:["Trabalhei explicitamente cognição × atenção","Trabalhei explicitamente cognição × afeto","Trabalhei explicitamente cognição × comportamento e self","Montei ao menos um loop cognitivo-emocional com três domínios"]},
  {s:["Plano evolutivo: pensar sobre o que deu errado e antecipar o que pode dar errado é <b>simulação barata</b> — resolver o problema na cabeça antes de pagar o custo no mundo. Ruminação e preocupação nascem dessa vantagem.",
      "Plano de manutenção: a simulação sem término não gera ação, ocupa o repertório e sustenta a resposta emocional que deveria resolver.",
      "Regras verbais: economizam aprendizagem por contingência direta; enrijecidas, blindam o paciente contra o que o ambiente ensina."],
   c:["Apresentei a função adaptativa do pensamento repetitivo e das regras verbais","Mostrei como o mesmo processo, rígido, mantém o sofrimento","Diferenciei pensamento repetitivo construtivo do improdutivo"]},
  {s:["Instrumentos possíveis (confira a versão em português antes de indicar): <b>CFQ</b> (fusão cognitiva), <b>RRS</b> (ruminação), <b>PSWQ</b> (preocupação), <b>MCQ-30</b> (crenças metacognitivas); ou um roteiro qualitativo com perguntas sobre frequência, duração, controlabilidade e o que a repetição resolve.",
      "Roleplay recomendado: aplicar o instrumento em voz alta explicando o que cada item acessa, e responder como o paciente responderia.",
      "Escolha um caso com nó central cognitivo (ruminação ou fusão) e trace as setas para atenção, afeto e comportamento.",
      "Fico à disposição para fazer o papel de paciente, se preferir o roleplay em dupla."],
   c:["Escolhi o instrumento qualitativo de autorrelato","Selecionei o caso com nó central cognitivo","Montei o diagrama dos nove domínios pré-desenhado com setas em transição","Gravei ou agendei o roleplay de avaliação"]},
  {s:["Procedimentos que casam com o domínio: <b>desfusão</b>, experimento comportamental como teste de hipótese, flexibilização de regras verbais, treino metacognitivo de detached mindfulness.",
      "Sugestão: conduzir uma sequência curta de desfusão com o aluno acompanhando, ou aplicar um experimento comportamental do início ao fim com paciente fictício.",
      "Feche mostrando o que muda no afeto e na esquiva quando a função do pensamento muda, mesmo com o conteúdo intacto."],
   c:["Escolhi o procedimento que será conduzido em cena","Defini o formato (prática ao vivo, aplicador-paciente ou paciente convidado)","Articulei o efeito da intervenção sobre os domínios vizinhos","Indiquei como monitorar a mudança clínica"]}
 ]},

{n:9, dom:3, tit:"Processos Emocionais e Intervenções para Modulação da Reatividade", prof:"Ana Caldas",
 un:["Emoções como processos construídos","Predição, corpo e experiência emocional","Aprendizagem, linguagem e reatividade","Interações emoção–cognição–atenção–comportamento","Intervenções para modulação da reatividade"],
 b:[
  {s:["A U2 encosta no domínio biofisiológico: mantenha o recorte na <b>interocepção e na predição</b> como parte da experiência emocional, sem virar aula de neurofisiologia geral.",
      "A esquiva experiencial aparece também na Disciplina 12 (comportamento): aqui ela entra como <b>estratégia de regulação</b>; lá, como padrão de evitação."],
   c:["Revisei as cinco unidades e aprovei ou ajustei os tópicos","Conferi o limite com as Disciplinas 12 (esquiva) e o domínio biofisiológico","Confirmei o recorte da U2 em interocepção e predição","Revisei a bibliografia básica"]},
  {s:["Objeto de aprendizagem sugerido: <b>“Clínica em Foco”</b> com um episódio emocional descrito em detalhe e o aluno separando gatilho, sensação corporal, rótulo e estratégia de regulação.",
      "Flash cards com imagem de sensações corporais e a pergunta sobre qual conceito emocional o paciente aplica àquele estado."],
   c:FLUXO},
  {s:["Com a atenção: a emoção dirige o foco e o foco intensifica a emoção — o mesmo loop que a Disciplina 7 trata pelo outro lado.",
      "Com a cognição: a linguagem categoriza a experiência; granularidade emocional baixa produz rótulos grosseiros e respostas rígidas.",
      "Com o comportamento e o self: a reatividade só vira quadro clínico quando organiza esquiva, e a vergonha liga afeto a identidade."],
   c:["Trabalhei explicitamente afeto × atenção","Trabalhei explicitamente afeto × cognição e linguagem","Trabalhei explicitamente afeto × comportamento e self","Montei ao menos um loop emocional com três domínios"]},
  {s:["Plano evolutivo: emoções sinalizam relevância e preparam a ação — medo mobiliza fuga, raiva sinaliza violação de limite, vergonha regula pertencimento ao grupo. Nenhuma delas é erro de sistema.",
      "Plano de manutenção: a estratégia que reduz o desconforto agora (supressão, esquiva experiencial) é reforçada negativamente e estreita o repertório emocional.",
      "Vale mostrar a predição rígida: quando o corpo antecipa sempre a mesma ameaça, a experiência confirma a previsão."],
   c:["Apresentei a função adaptativa das emoções e da reatividade","Mostrei como a estratégia de regulação vira mantenedora","Trabalhei a rigidez preditiva como alavanca clínica"]},
  {s:["Instrumentos possíveis (confira a versão em português antes de indicar): <b>DERS</b> (dificuldades de regulação), <b>ERQ</b> (reavaliação × supressão), <b>AAQ-II</b> (esquiva experiencial), <b>TAS-20</b> (alexitimia); ou um roteiro qualitativo sobre o que a pessoa faz quando a emoção sobe e o que teme que aconteça se não fizer.",
      "Roleplay recomendado: aplicar o instrumento em voz alta explicando o que cada item acessa, e responder como o paciente responderia.",
      "Escolha um caso com nó central afetivo (reatividade, esquiva experiencial) e trace as setas para atenção, cognição e comportamento.",
      "Fico à disposição para fazer o papel de paciente, se preferir o roleplay em dupla."],
   c:["Escolhi o instrumento qualitativo de autorrelato","Selecionei o caso com nó central afetivo","Montei o diagrama dos nove domínios pré-desenhado com setas em transição","Gravei ou agendei o roleplay de avaliação"]},
  {s:["Procedimentos que casam com o domínio: exposição emocional orientada por processo, exposição interoceptiva, <b>rotulação e refinamento</b> da experiência (granularidade), práticas de abertura e aceitação, regulação por via corporal.",
      "Sugestão: conduzir uma prática breve de contato com a sensação corporal em tempo real, ou aplicar um exercício de nomeação fina de emoção com paciente fictício.",
      "Feche mostrando o efeito sobre a ruminação e sobre a esquiva comportamental."],
   c:["Escolhi o procedimento que será conduzido em cena","Defini o formato (prática ao vivo, aplicador-paciente ou paciente convidado)","Articulei o efeito da intervenção sobre os domínios vizinhos","Indiquei como monitorar a mudança clínica"]}
 ]},

{n:10, dom:2, tit:"Processos do Self: Autocrítica, Identidade, Vergonha e Perspectiva", prof:"Bolívar Filho",
 un:["O self como processo psicológico","Self como conteúdo e self como perspectiva","Autocrítica e vergonha transdiagnósticas","Integração self–emoção–cognição–comportamento","Intervenções focadas nos processos do self"],
 b:[
  {s:["Dois limites a conferir: com a Disciplina 8, a fusão é o mecanismo cognitivo — aqui o foco é a fusão <b>com o autoconceito</b>; com a Disciplina 9, a vergonha entra pela função identitária e relacional, não pela regulação emocional em geral.",
      "A U2 (self como perspectiva) é o que sustenta a U5: confira se a sequência prepara as intervenções de descentramento."],
   c:["Revisei as cinco unidades e aprovei ou ajustei os tópicos","Conferi o limite com as Disciplinas 8 (fusão) e 9 (vergonha como emoção)","Confirmei que a U2 prepara conceitualmente as intervenções da U5","Revisei a bibliografia básica"]},
  {s:["Objeto de aprendizagem sugerido: <b>flash cards</b> contrastando falas de self-como-conteúdo (“eu sou um fracasso”) e self-como-perspectiva (“estou tendo o pensamento de que…”).",
      "Situação-problema com um paciente cuja narrativa identitária impede uma ação valorada rende bem na U4."],
   c:FLUXO},
  {s:["Com o afeto: autocrítica e vergonha são o par mais óbvio — mostre a sequência avaliação de si → vergonha → ocultamento.",
      "Com a cognição: a narrativa identitária é uma regra verbal sobre si; sem esse elo, o self vira tema abstrato.",
      "Com o comportamento e o sociocultural: a vergonha organiza evitação de exposição social, e os padrões normativos internalizados vêm de um contexto — vale nomeá-lo."],
   c:["Trabalhei explicitamente self × afeto (vergonha, autocrítica)","Trabalhei explicitamente self × cognição (narrativa, regra verbal)","Trabalhei explicitamente self × comportamento e contexto sociocultural","Montei ao menos um loop identitário com três domínios"]},
  {s:["Plano evolutivo: somos animais de grupo. Monitorar como se é visto, corrigir-se antes que o grupo corrija e sinalizar submissão por vergonha <b>evitava a exclusão</b> — e exclusão, na história da espécie, custava a vida.",
      "Plano de manutenção: a autocrítica que servia de correção antecipada vira punição crônica; a vergonha que servia de reparo vira ocultamento e afastamento do que repararia.",
      "Vale explicitar por que a autocrítica é autorreforçadora: alivia a ameaça de julgamento externo no curto prazo."],
   c:["Apresentei a função adaptativa/social da autocrítica e da vergonha","Mostrei como esses processos, rígidos, mantêm o sofrimento","Expliquei por que a autocrítica se autorreforça"]},
  {s:["Instrumentos possíveis (confira a versão em português antes de indicar): <b>FSCRS</b> (formas de autocrítica e autotranquilização, Gilbert), <b>Escala de Autocompaixão</b> (Neff), escalas de vergonha (ex.: <b>ESS</b>), <b>SCS</b> de fusão com autoconceito; ou um roteiro qualitativo sobre o que a pessoa diz a si mesma quando erra e o que teme que os outros vejam.",
      "Roleplay recomendado: aplicar o instrumento em voz alta explicando o que cada item acessa, e responder como o paciente responderia.",
      "Escolha um caso com nó central no self (autocrítica, vergonha, rigidez identitária) e trace as setas para afeto, cognição e comportamento.",
      "Fico à disposição para fazer o papel de paciente, se preferir o roleplay em dupla."],
   c:["Escolhi o instrumento qualitativo de autorrelato","Selecionei o caso com nó central no self","Montei o diagrama dos nove domínios pré-desenhado com setas em transição","Gravei ou agendei o roleplay de avaliação"]},
  {s:["Procedimentos que casam com o domínio: treino de mente compassiva e regulação da autocrítica, exercícios de <b>tomada de perspectiva</b> (eu–aqui–agora × lá–então), trabalho com duas cadeiras, exposição à vergonha, reestruturação narrativa por função.",

/* ================= estado ================= */
const KEY = "wainer-tbp-guia-v1";
let ST = {};
try{ ST = JSON.parse(localStorage.getItem(KEY) || "{}"); }catch(e){ ST = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(ST)); return true; }catch(e){ return false; } }

function totalChecks(d){ return d.b.reduce((a,b)=>a+b.c.length,0); }
function doneChecks(d){
  let n=0;
  d.b.forEach((b,bi)=>b.c.forEach((_,ci)=>{ if(ST["c:"+d.n+":"+bi+":"+ci]) n++; }));
  return n;
}
function pct(d){ const t=totalChecks(d); return t? Math.round(doneChecks(d)/t*100):0; }

/* ================= render ================= */
const esc = s => String(s).replace(/&(?![a-z]+;)/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function matrixHTML(dom){
  let h = '<div><div class="matrix">';
  DOM9.forEach((n,i)=>{
    const cls = dom===null ? "all" : (i===dom ? "lit" : "");
    h += '<span class="'+cls+'">'+n+'</span>';
  });
  h += '</div><p class="matcap">'+(dom===null?"leitura transversal":"nó principal")+'</p></div>';
  return h;
}

function viewHome(){
  const total = D.reduce((a,d)=>a+totalChecks(d),0);
  const done  = D.reduce((a,d)=>a+doneChecks(d),0);
  let h = '<div class="head"><div class="wrap"><div style="flex:1">'
    + '<p class="eyebrow">Instituto Wainer de Pós-Graduação</p>'
    + '<h1>Guia de produção das disciplinas</h1>'
    + '<p class="prof">Pós-Graduação em <b>Terapia Baseada em Processos</b> · coordenação: <b>Prof. Júlio Gonçalves</b></p>'
    + '</div>' + matrixHTML(null) + '</div></div>';

  h += '<div class="units"><div class="wrap">'
     + '<span><b>9</b> disciplinas</span><span><b>5</b> unidades cada</span>'
     + '<span><b>4</b> vídeos + 2 objetos por unidade</span><span><b>6</b> orientações por disciplina</span>'
     + '<span><b>'+done+'/'+total+'</b> itens marcados</span></div></div>';

  h += '<div class="wrap">';
  h += '<p class="lede">Prezado professor: seguem seis orientações para a construção da sua disciplina. Elas valem para qualquer domínio — atenção, cognição, self, afeto, comportamento, motivação, biofisiológico, contexto ou sociocultural. Onde uso exemplos, eles são apenas ilustrativos: traduza a lógica para o processo que você ensina.</p>';
  h += '<p style="font-size:14.5px;color:var(--ink-2)">Os dois primeiros pontos são operacionais; os quatro seguintes tratam de conteúdo e condução. Abra a sua disciplina no menu: cada ponto vem com sugestões de como cumpri-lo no seu domínio, um checklist para acompanhar e um campo de anotações que salva no seu navegador.</p>';

  h += '<div class="six">';
  SEIS.forEach((s,i)=>{ h += '<div><div class="n">'+(i+1)+'</div><div><h4>'+s.t+'</h4><p>'+s.d+'</p></div></div>'; });
  h += '</div>';

  h += '<h3 class="sec">Andamento por disciplina</h3><div class="tally">';
  D.forEach(d=>{
    h += '<a href="#d'+d.n+'" data-go="'+d.n+'"><div class="k">DISCIPLINA '+d.n+'</div>'
      + '<div class="v">'+esc(d.tit)+'</div>'
      + '<div class="p">'+pct(d)+'% · '+esc(d.prof)+'</div></a>';
  });
  h += '</div>';

  h += '<div class="help"><h4>Estou à disposição</h4>'
    + '<p>Qualquer unidade pode ser ajustada comigo — inclusive cortar, mover ou trocar conteúdo entre disciplinas. Se algum tópico parecer melhor alocado em outra disciplina, me avise que eu realoco.</p>'
    + '<p>Também fico à disposição para <b>fazer o papel de paciente</b> nos roleplays de avaliação e de intervenção; depois acertamos com o audiovisual como compor isso no vídeo.</p>'
    + '<p class="sig">Prof. Júlio Gonçalves · coordenação da pós-graduação em Terapia Baseada em Processos</p></div>';

  h += '<div class="tools">'
    + '<button class="btn" data-act="export">Baixar minhas anotações (.txt)</button>'
    + '<button class="btn ghost" data-act="print">Imprimir / salvar em PDF</button>'
    + '<button class="btn ghost" data-act="reset">Limpar tudo</button></div>';

  h += '<footer class="foot">As marcações e anotações ficam salvas apenas neste navegador, neste computador. Use “Baixar minhas anotações” para guardar uma cópia.</footer>';
  h += '</div>';
  return h;
}

function viewDisc(d){
  let h = '<div class="head"><div class="wrap"><div style="flex:1">'
    + '<p class="eyebrow">Disciplina '+d.n+' · Terapia Baseada em Processos</p>'
    + '<h1>'+esc(d.tit)+'</h1>'
    + '<p class="prof">Professor: <b>'+esc(d.prof)+'</b> · '+pct(d)+'% das orientações marcadas</p>'
    + '</div>' + matrixHTML(d.dom) + '</div></div>';

  h += '<div class="units"><div class="wrap">';
  d.un.forEach((u,i)=>{ h += '<span><b>U'+(i+1)+'</b>'+esc(u)+'</span>'; });
  h += '</div></div><div class="wrap">';

  d.b.forEach((b,bi)=>{
    const tot=b.c.length, dn=b.c.filter((_,ci)=>ST["c:"+d.n+":"+bi+":"+ci]).length;
    const open = ST["o:"+d.n+":"+bi] ? " open":"";
    h += '<section class="block'+open+'" data-b="'+bi+'">'
      + '<header data-toggle="'+bi+'"><div class="bn">'+(bi+1)+'</div>'
      + '<div class="bt"><h2>'+SEIS[bi].t+'</h2><p>'+SEIS[bi].d+'</p></div>'
      + '<div class="bstate'+(dn===tot?" full":"")+'">'+dn+'/'+tot+'</div><div class="chev">▸</div></header>'
      + '<div class="body">'
      + '<h3 class="sec">O que foi pedido</h3><p class="orient">'+SEIS[bi].o+'</p>'
      + '<h3 class="sec">Como cumprir nesta disciplina</h3><ul class="sug">';
    b.s.forEach(s=>{ h += '<li>'+s+'</li>'; });
    h += '</ul><h3 class="sec">Checklist</h3>';
    b.c.forEach((c,ci)=>{
      const id="c:"+d.n+":"+bi+":"+ci, on=!!ST[id];
      h += '<label class="chk'+(on?" done":"")+'"><input type="checkbox" data-ck="'+id+'"'+(on?" checked":"")+'><span>'+esc(c)+'</span></label>';
    });
    const nid="n:"+d.n+":"+bi;
    h += '<div class="notewrap"><div class="notehead"><label for="'+nid+'">Minhas ideias sobre este ponto</label>'
      + '<span class="saved" id="s_'+nid.replace(/:/g,"_")+'">salvo</span></div>'
      + '<textarea id="'+nid+'" data-nt="'+nid+'" placeholder="O que você quer lembrar, propor ou pedir à coordenação sobre este ponto…">'+esc(ST[nid]||"")+'</textarea></div>';
    h += '</div></section>';
  });

  const gid="n:"+d.n+":geral";
  h += '<div class="notewrap"><div class="notehead"><label for="'+gid+'">Ideias gerais para a Disciplina '+d.n+'</label>'
    + '<span class="saved" id="s_'+gid.replace(/:/g,"_")+'">salvo</span></div>'
    + '<textarea id="'+gid+'" data-nt="'+gid+'" style="min-height:120px" placeholder="Ajustes de ementa, pedidos à coordenação, ideias de objeto de aprendizagem, nomes de casos…">'+esc(ST[gid]||"")+'</textarea></div>';

  h += '<div class="help"><h4>Estou à disposição</h4>'
    + '<p>Qualquer unidade desta disciplina pode ser ajustada comigo. Se algum tópico parecer melhor alocado em outra disciplina, me avise que eu realoco.</p>'
    + '<p>Também fico à disposição para <b>fazer o papel de paciente</b> nos roleplays dos pontos 5 e 6.</p>'
    + '<p class="sig">Prof. Júlio Gonçalves · coordenação da pós-graduação em Terapia Baseada em Processos</p></div>';

  h += '<div class="tools">'
    + '<button class="btn" data-act="export">Baixar minhas anotações (.txt)</button>'
    + '<button class="btn ghost" data-act="print">Imprimir / salvar em PDF</button>'
    + '<button class="btn ghost" data-act="home">Voltar às orientações gerais</button></div>';
  h += '</div>';
  return h;
}

/* ================= navegação ================= */
let cur = null;

function renderNav(){
  const nav = document.getElementById("nav");
  let h = '<button class="navitem'+(cur===null?" on":"")+'" data-go="home"><span class="num">✦</span>'
        + '<span class="t">Orientações gerais<small>os seis pontos, para todas</small></span></button>'
        + '<p class="navlabel">Disciplinas</p>';
  D.forEach(d=>{
    const p=pct(d);
    h += '<button class="navitem'+(cur===d.n?" on":"")+(p===100?" done":"")+'" data-go="'+d.n+'">'
      + '<span class="num">'+d.n+'</span>'
      + '<span class="t">'+esc(d.tit)+'<small>'+esc(d.prof)+'</small></span>'
      + '<span class="pct">'+p+'%</span></button>';
  });
  nav.innerHTML = h;

  const sel = document.getElementById("msel");
  let o = '<option value="home"'+(cur===null?" selected":"")+'>Orientações gerais</option>';
  D.forEach(d=>{ o += '<option value="'+d.n+'"'+(cur===d.n?" selected":"")+'>'+d.n+' · '+esc(d.tit)+' ('+pct(d)+'%)</option>'; });
  sel.innerHTML = o;

  const total = D.reduce((a,d)=>a+totalChecks(d),0);
  const done  = D.reduce((a,d)=>a+doneChecks(d),0);
  const gp = total? Math.round(done/total*100):0;
  document.getElementById("gpct").textContent = gp+"%";
  document.getElementById("gbar").style.width = gp+"%";
}

function go(v, keepScroll){
  cur = (v==="home"||v===null) ? null : Number(v);
  const main = document.getElementById("main");
  main.innerHTML = cur===null ? viewHome() : viewDisc(D.find(d=>d.n===cur));
  renderNav();
  if(!keepScroll) window.scrollTo(0,0);
  location.hash = cur===null ? "" : "d"+cur;
}

/* ================= eventos ================= */
document.addEventListener("click", e=>{
  const nb = e.target.closest("[data-go]");
  if(nb){ e.preventDefault(); go(nb.dataset.go); return; }

  const th = e.target.closest("[data-toggle]");
  if(th){
    const sec = th.parentElement, bi = th.dataset.toggle;
    sec.classList.toggle("open");
    ST["o:"+cur+":"+bi] = sec.classList.contains("open"); save();
    return;
  }

  const ab = e.target.closest("[data-act]");
  if(ab){
    const a = ab.dataset.act;
    if(a==="print") window.print();
    if(a==="home") go("home");
    if(a==="export") exportTxt();
    if(a==="reset"){
      if(confirm("Isso apaga todas as marcações e anotações salvas neste navegador. Continuar?")){
        ST={}; save(); go(cur===null?"home":cur);
      }
    }
  }
});

document.addEventListener("change", e=>{
  if(e.target.matches("[data-ck]")){
    ST[e.target.dataset.ck] = e.target.checked; save();
    e.target.closest("label").classList.toggle("done", e.target.checked);
    const sec = e.target.closest(".block"), bi = sec.dataset.b;
    const d = D.find(x=>x.n===cur), tot = d.b[bi].c.length;
    const dn = d.b[bi].c.filter((_,ci)=>ST["c:"+d.n+":"+bi+":"+ci]).length;
    const st = sec.querySelector(".bstate");
    st.textContent = dn+"/"+tot; st.classList.toggle("full", dn===tot);
    const hp = document.querySelector(".head .prof");
    if(hp) hp.innerHTML = 'Professor: <b>'+esc(d.prof)+'</b> · '+pct(d)+'% das orientações marcadas';
    renderNav();
  }
  if(e.target.id==="msel") go(e.target.value);
});

let timers = {};
document.addEventListener("input", e=>{
  const t = e.target;
  if(!t.matches("[data-nt]")) return;
  const k = t.dataset.nt;
  clearTimeout(timers[k]);
  timers[k] = setTimeout(()=>{
    ST[k] = t.value;
    const ok = save();
    const tag = document.getElementById("s_"+k.replace(/:/g,"_"));
    if(tag){
      tag.textContent = ok ? "salvo "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}) : "não foi possível salvar";
      tag.style.color = ok ? "var(--ok)" : "#a33";
      tag.classList.add("show");
      setTimeout(()=>tag.classList.remove("show"), 2200);
    }
  }, 500);
});

function exportTxt(){
  let out = "GUIA DE PRODUÇÃO DAS DISCIPLINAS — PÓS-GRADUAÇÃO EM TERAPIA BASEADA EM PROCESSOS\n";
  out += "Instituto Wainer de Pós-Graduação · exportado em "+new Date().toLocaleString("pt-BR")+"\n";
  D.forEach(d=>{
    out += "\n\n==========================================================\n";
    out += "DISCIPLINA "+d.n+" — "+d.tit+"\nProfessor: "+d.prof+" · "+pct(d)+"% marcado\n";
    d.b.forEach((b,bi)=>{
      out += "\n["+(bi+1)+"] "+SEIS[bi].t+"\n";
      b.c.forEach((c,ci)=>{ out += "  "+(ST["c:"+d.n+":"+bi+":"+ci]?"[x]":"[ ]")+" "+c+"\n"; });
      const nt = ST["n:"+d.n+":"+bi];
      if(nt && nt.trim()) out += "  Ideias: "+nt.replace(/\n/g,"\n         ")+"\n";
    });
    const g = ST["n:"+d.n+":geral"];
    if(g && g.trim()) out += "\nIdeias gerais da disciplina:\n"+g+"\n";
  });
  const blob = new Blob([out], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "guia-tbp-anotacoes.txt";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
}

/* ================= início ================= */
const hash = (location.hash||"").replace("#d","");
go(hash && D.some(d=>d.n===Number(hash)) ? Number(hash) : "home", true);
</script>
